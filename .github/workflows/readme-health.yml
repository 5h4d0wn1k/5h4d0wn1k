name: README Health Check

on:
  pull_request:
    paths: ["README.md", ".github/**"]
  push:
    branches: [main]
    paths: ["README.md", ".github/**"]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  validate-readme:
    name: Validate README links and badges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract image URLs from README
        id: urls
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          text = Path("README.md").read_text()
          urls = sorted(set(
              u for u in re.findall(r'https://[^\s)"\']+', text)
              if any(ext in u for ext in (".svg", ".png", ".jpg", ".jpeg", ".webp"))
              or any(d in u for d in ("vercel.app", "rshah.org", "demolab.com", "img.shields.io", "repo-widget", "github-profile-summary"))
          ))
          Path(".urls.txt").write_text("\n".join(urls) + ("\n" if urls else ""))
          print(f"Found {len(urls)} image URLs to check")
          EOF

      - name: Check all image URLs return 200
        run: |
          if [ ! -s .urls.txt ]; then
            echo "No image URLs found to validate." && exit 0
          fi
          failures=0
          while read -r url; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "$url")
            [ "$code" = "200" ] || { echo "DEAD ($code): $url"; failures=$((failures+1)); }
          done < .urls.txt
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures image URL(s) returned a non-200 status."
            exit 1
          fi
          echo "All image URLs returned HTTP 200."

      - name: Check for known-dead services
        run: |
          if grep -Eq "github-readme-stats\.vercel\.app|github-readme-activity-graph" README.md; then
            echo "::error::README uses a known-dead badge service (github-readme-stats / activity-graph). Remove it."
            exit 1
          fi
          echo "No known-dead services detected."