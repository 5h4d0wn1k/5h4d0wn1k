name: README Health Check

on:
  pull_request:
    paths: ["README.md", "scripts/**", ".github/**"]
  push:
    branches: [main]
    paths: ["README.md", "scripts/**", ".github/**"]
  schedule:
    # Weekly. The README is mostly live badges, so it rots between pull requests:
    # a service can be retired, an endpoint removed, or a repository renamed with
    # nothing in the repository changing at all. This is the run that catches it.
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      strict:
        description: "Treat warnings as failures (bot-blocked hosts included)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-readme:
    name: Validate README links and badges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Replaces a status-code-only sweep over image URLs, which passed a badge
      # that had been rendering "404: badge not found" behind an HTTP 200.
      # The validator checks every URL on the page, reads badge bodies, and
      # reconciles the contribution ledger against a dated ground-truth snapshot.
      - name: Validate README
        run: python scripts/validate_readme.py README.md ${{ inputs.strict && '--strict' || '' }}

      - name: Summarise
        if: always()
        run: |
          {
            echo "### README validation"
            echo
            echo '```'
            python scripts/validate_readme.py README.md --offline || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
